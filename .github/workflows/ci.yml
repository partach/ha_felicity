name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:

permissions: {}
jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # PIN the linter.  This was unpinned, so `ruff check .` ran whatever
          # was newest — and ruff 0.16 expanded its DEFAULT rule set from 59
          # rules to 413, turning a green build into 211 errors overnight with
          # no code change.  A linter upgrade should be a deliberate commit
          # (bump this pin, fix or ignore the new rules), never a surprise.
          # The enforced rules live in ruff.toml.
          pip install ruff==0.16.7

      - name: Lint Python (Ruff)
        run: ruff check .

      # CI previously ran NO tests at all, so a broken test harness was
      # invisible: tests/test_coordinator.py had stopped collecting entirely
      # (a hand-typed `const` stub drifted from production) and nothing noticed.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q

      # The simulator is the project's behavioural gate (see CLAUDE.md): it runs
      # the real scheduler over the scenario library for BOTH engines and exits
      # non-zero when any scenario's expectation fails.  Unit tests pin the
      # functions; this pins what the EMS actually decides.
      - name: Run EMS scenario simulator (both engines)
        run: python tools/ems_simulator.py --no-plot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint JavaScript (ESLint)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint
          else
            echo "No package.json found, skipping JS lint."
          fi
