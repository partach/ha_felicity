name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:

permissions: {}
jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # PIN the linter.  This was unpinned, so `ruff check .` ran whatever
          # was newest — and ruff 0.16 expanded its DEFAULT rule set from 59
          # rules to 413, turning a green build into 211 errors overnight with
          # no code change.  A linter upgrade should be a deliberate commit
          # (bump this pin, fix or ignore the new rules), never a surprise.
          # The enforced rules live in ruff.toml.
          pip install ruff==0.16.7

      - name: Lint Python (Ruff)
        run: ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint JavaScript (ESLint)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint
          else
            echo "No package.json found, skipping JS lint."
          fi
